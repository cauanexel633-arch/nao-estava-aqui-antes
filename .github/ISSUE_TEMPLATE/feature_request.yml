name: "💡 Sugerir uma melhoria / Suggest an improvement"
description: "Compartilhe uma ideia para o jogo / Share an idea for the game"
title: "[SUGESTÃO] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "Sua sugestão / Your suggestion"
      description: "Explique sua ideia."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Por que seria útil? / Why would it be useful?"
    validations:
      required: false
